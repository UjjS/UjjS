name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ujjwalshikhar
          outputs: |
            ./snake.svg
            ./snake.gif

      - name: Commit and Push
        uses: EndBug/add-and-commit@v9
        with:
          message: "Generate snake animation"
          add: "snake.svg snake.gif"
